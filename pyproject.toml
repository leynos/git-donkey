[project]
name = "git-donkey"
version = "0.1.0"
description = "git-donkey package"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "ISC" }
dependencies = [
    "GitPython>=3.1.45",
    "cyclopts>=4.21.0",
    "github3.py>=4.0.1",
    "loctocat>=0.6.0",
    "platformdirs>=4.10.0",
    "plumbum>=1.8",
    "python-slugify>=8.0.0",
]

[project.scripts]
git-donkey = "git_donkey.cli:git_donkey"
git-track = "git_donkey.cli:git_track"
git-fafo = "git_donkey.cli:git_fafo"
git-plonk = "git_donkey.cli:git_plonk"
git-donkey-template = "git_donkey.cli:git_donkey_template"
git-incoming = "git_donkey.cli:git_incoming"
git-in = "git_donkey.cli:git_in"
git-outgoing = "git_donkey.cli:git_outgoing"
git-out = "git_donkey.cli:git_out"

[dependency-groups]
dev = [
    "pytest",
    "PyYAML>=6.0.3,<7",
    "hypothesis>=6.165.10,<7",
    "ruff==0.16.6",
    "pyright",
    "pytest-timeout",
    "pytest-xdist",
    "interrogate>=1.7.0",
    "pytest-bdd>=8.1.0,<9",
    "syrupy>=5.5.3,<6",
    "pylint>=4.0,<5",
    "df12-python-lints @ git+https://github.com/leynos/df12-python-lints@v0.2.0",
]

[tool.ruff]
line-length = 88
preview = true
extend-exclude = [
    "scripts/generate_typos_config.py",
    "scripts/typos_rollout.py",
    "scripts/typos_rollout_cache.py",
    "scripts/tests/test_typos_rollout.py",
]

[tool.ruff.lint]
select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Warn if certain things can changed due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "FA",       # Enforce from __future__ import annotations
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    "TD",       # Be diligent with TODO comments
    "A",        # detect shadowed builtins
    "BLE",      # disallow catch-all exceptions
    "S",        # disallow things like "exec"; also restricts "assert" but I just NOQA it when I really need it
    "DTZ",      # require strict timezone manipulation with datetime
    "FBT",      # detect boolean traps
    "N",        # enforce naming conventions, e.g. ClassName vs function_name
    "EM",
    "FURB",
    "B",
    "RUF",
    "LOG",
    "Q",
    "PT",
    "RSE",
    "PERF",
    "TRY",
    "D",
    "DOC",      # Enforce docstring signature/return/raises sections (pydoclint)
    "ANN",
    "C90",
    "PLR",
    "modified-iterating-set",
    "no-classmethod-decorator",
    "no-staticmethod-decorator",
    "too-many-locals",
    "too-many-boolean-expressions",
    "too-many-nested-blocks",
    "non-augmented-assignment",
    "literal-membership",
    "no-self-use",
    "unnecessary-lambda",
    "none-not-at-end-of-union",
    "class-with-mixed-type-vars",
    "unnecessary-regular-expression",
    "non-octal-permissions",
    "property-without-return",
]
extend-ignore = [
    "incorrect-blank-line-before-class",  # Conflicts with D211; prefer enforcing no blank line before class docstring.
    "multi-line-summary-second-line",  # Conflicts with D212; keep summary on the first line.
    # Conflicts with this project's public-API convention. The rule wants
    # exceptions a function does not raise *directly* removed from its
    # docstring, but a propagated exception is still part of the caller-visible
    # contract: donkey.py and template_cmd.py both catch the ValueError that
    # templates.py propagates out of _get_repo_url. Under-documentation, the
    # dangerous direction, is still caught by DOC501.
    "docstring-extraneous-exception",
]

[tool.ruff.lint.per-file-ignores]
# `assert` is pytest's idiom and the hook its assertion rewriting depends on,
# so the rule has no compliant alternative in a test; every other exemption has
# been removed and the underlying violations fixed.
"**/test_*.py" = ["assert"]
"tests/steps/*.py" = ["assert"]

[tool.ruff.lint.flake8-import-conventions]
# Declare the banned `from` imports.
banned-from = [
    "typing",
    "datetime",
    "collections.abc",
    "dataclasses",
    "enum",
    "unittest.mock",
    "msgspec",
]

[tool.ruff.lint.flake8-import-conventions.aliases]
# Declare the default aliases.
altair = "alt"
"matplotlib.pyplot" = "plt"
numpy = "np"
pandas = "pd"
seaborn = "sns"
scipy = "sp"
"collections.abc" = "cabc"
datetime = "dt"
"unittest.mock" = "mock"
"msgspec.json" = "msjson"
typing = "typ"

[tool.ruff.lint.pydocstyle]
# Enforce NumPy docstring style
convention = "numpy"
ignore-decorators = ["typing.overload", "typ.overload"]

[tool.ruff.lint.pydoclint]
# Keep the repository convention of single-line docstrings for simple, mostly
# private helpers; DOC signature checks apply only to multi-line docstrings.
ignore-one-line-docstrings = true

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 4
max-bool-expr = 2
max-locals = 10

[tool.ty.environment]
# The estate typos-rollout scripts import each other as top-level modules and
# `scripts/` is not a package, so the directory belongs on the module search
# path. Editors honour this setting; the `typecheck` target also passes
# `--extra-search-path scripts` because ty does not apply config-sourced extra
# paths when it resolves the PEP 723 script as a standalone program.
extra-paths = ["scripts"]

[tool.interrogate]
ignore-overloaded-functions = true

# This [tool.pylint] table configures the built-in Pylint pass. It and the
# df12-python-lints plugin pass (configured in .pylintrc-df12.toml) both run
# under the project virtual-env's CPython; see the Makefile.
[tool.pylint.main]
# The shared spelling-rollout helpers keep their own pinned Ruff and coverage
# policy; exclude them here as they are excluded from Ruff.
ignore = [
    "generate_typos_config.py",
    "typos_rollout.py",
    "typos_rollout_cache.py",
    "test_typos_rollout.py",
]
# Expand directory targets like git_donkey and tests even when a target is not
# a package.
recursive = true
# Match the project's supported baseline (requires-python = ">=3.13") so the
# version-gated checks reason about the oldest interpreter we support.
py-version = "3.13"
# Keep Pylint's module-size check active without forcing an unrelated module
# split while introducing the second-tier lint gate.
max-module-lines = 800

[tool.pylint.design]
# Keep function call surfaces small enough to understand without memorising
# positional argument order.
max-args = 5
# Complement Ruff's stricter PLR0914 threshold without forcing broad refactors
# while introducing the additional rule families below.
max-locals = 20
# Use Pylint's statement-count proxy for function length; Pylint 4 does not
# expose a distinct physical-lines-per-function option.
max-statements = 70
# Keep positional call surfaces aligned with Ruff's existing argument limit.
max-positional-arguments = 5

[tool.pylint."messages control"]
# Keep this Pylint pass focused on the explicitly selected messages.
disable = ["all"]
enable = [
    # Logging format safety.
    "logging-format-interpolation",
    "logging-format-truncated",
    "logging-fstring-interpolation",
    "logging-not-lazy",
    "logging-too-few-args",
    "logging-too-many-args",
    "logging-unsupported-format",

    # Pattern matching correctness and readability.
    "bare-name-capture-pattern",
    "invalid-match-args-definition",
    "match-class-bind-self",
    "match-class-positional-attributes",
    "multiple-class-sub-patterns",
    "too-many-positional-sub-patterns",

    # Control-flow simplification.
    "chained-comparison",
    "condition-evals-to-constant",
    "consider-merging-isinstance",
    "consider-swap-variables",
    "consider-using-in",
    "consider-using-max-builtin",
    "consider-using-min-builtin",
    "consider-using-sys-exit",
    "consider-using-ternary",
    "inconsistent-return-statements",
    "no-else-break",
    "no-else-continue",
    "no-else-raise",
    "no-else-return",
    "redefined-argument-from-local",
    "simplifiable-condition",
    "simplifiable-if-expression",
    "simplifiable-if-statement",
    "simplify-boolean-expression",
    "stop-iteration-return",
    "super-with-arguments",
    "trailing-comma-tuple",
    "unnecessary-negation",
    "useless-return",

    # Collection and iterator idioms.
    "consider-iterating-dictionary",
    "consider-using-dict-comprehension",
    "consider-using-dict-items",
    "consider-using-enumerate",
    "consider-using-f-string",
    "consider-using-generator",
    "consider-using-get",
    "consider-using-join",
    "consider-using-set-comprehension",
    "unnecessary-comprehension",
    "unnecessary-dict-index-lookup",
    "unnecessary-list-index-lookup",
    "use-a-generator",
    "use-dict-literal",
    "use-implicit-booleaness-not-comparison",
    "use-implicit-booleaness-not-comparison-to-string",
    "use-implicit-booleaness-not-len",
    "use-list-literal",
    "use-maxsplit-arg",
    "use-sequence-for-iteration",
    "use-yield-from",

    # Runtime APIs, resources, and compatibility hazards.
    "bad-open-mode",
    "bad-thread-instantiation",
    "boolean-datetime",
    "consider-using-with",
    "deprecated-argument",
    "deprecated-attribute",
    "deprecated-class",
    "deprecated-decorator",
    "deprecated-method",
    "forgotten-debug-statement",
    "invalid-envvar-default",
    "invalid-envvar-value",
    "method-cache-max-size-none",
    "redundant-unittest-assert",
    "shallow-copy-environ",
    "singledispatch-method",
    "singledispatchmethod-function",
    "subprocess-popen-preexec-fn",
    "subprocess-run-check",
    "unnecessary-dunder-call",
    "unnecessary-ellipsis",
    "unspecified-encoding",

    # Source layout and text hygiene.
    "missing-final-newline",
    "mixed-line-endings",
    "superfluous-parens",
    "trailing-newlines",
    "trailing-whitespace",
    "unexpected-line-ending-format",

    # Mutation during iteration.
    "modified-iterating-dict",
    "modified-iterating-list",
    "modified-iterating-set",

    # Structural complexity limits.
    "too-many-arguments",
    "too-many-boolean-expressions",
    "too-many-branches",
    "too-many-lines",
    "too-many-locals",
    "too-many-nested-blocks",
    "too-many-positional-arguments",
    "too-many-public-methods",
    "too-many-statements",
]

[tool.pytest.ini_options]
# Tests automatically killed after seconds elapsed
timeout = 30
filterwarnings = [
    # slipcover registers a pytest11 plugin entry point (for its
    # pytest-xdist support added in plasma-umass/slipcover#71). When
    # invoked as `python -m slipcover -m pytest`, slipcover is already
    # imported by the time pytest tries to rewrite its assertions, so
    # pytest emits PytestAssertRewriteWarning. Slipcover isn't a test
    # library and doesn't need rewriting; suppress the specific
    # message so unrelated rewrite warnings still surface.
    "ignore:Module already imported so cannot be rewritten; slipcover:pytest.PytestAssertRewriteWarning",
]

[tool.uv]
package = true

# The workflow reaches the recorder through observability.get_recorder(), so
# a static call graph cannot follow it into the implementations. The recorder
# is also installed from outside the package by embedders and the test suite.
# Each rule names one symbol the workflow or an installer reaches that way,
# together with the caller that reaches it. The approved set is pinned by
# tests/unit/test_skylos_lint_contract.py.
[tool.skylos.dead_code]

[[tool.skylos.dead_code.entrypoints]]
name = "NullRecorder.record"
full_name = "git_donkey.observability.NullRecorder.record"
reason = "Reached through the recorder observability.get_recorder() returns"

[[tool.skylos.dead_code.entrypoints]]
name = "NullRecorder.span"
full_name = "git_donkey.observability.NullRecorder.span"
reason = "Reached through the recorder observability.get_recorder() returns"

[[tool.skylos.dead_code.entrypoints]]
name = "observation"
full_name = "git_donkey.observability.NullRecorder.record.*"
reason = "NullRecorder.record discards the argument the Recorder protocol passes"

[[tool.skylos.dead_code.entrypoints]]
name = "operation"
full_name = "git_donkey.observability.NullRecorder.span.*"
reason = "NullRecorder.span discards the argument the Recorder protocol passes"

[[tool.skylos.dead_code.entrypoints]]
name = "LoggingRecorder"
full_name = "git_donkey.observability.LoggingRecorder"
reason = "Installed by embedders with observability.set_recorder()"

[[tool.skylos.dead_code.entrypoints]]
name = "LoggingRecorder.record"
full_name = "git_donkey.observability.LoggingRecorder.record"
reason = "Called on the recorder an embedder installs"

[[tool.skylos.dead_code.entrypoints]]
name = "LoggingRecorder.span"
full_name = "git_donkey.observability.LoggingRecorder.span"
reason = "Called on the recorder an embedder installs"

[[tool.skylos.dead_code.entrypoints]]
name = "set_recorder"
full_name = "git_donkey.observability.set_recorder"
reason = "Called by embedders and the test suite to install a recorder"

[tool.skylos.gate]
strict = true

[tool.skylos.whitelist]
names = []

[tool.skylos.whitelist.documented]

[build-system]
requires = ["hatchling", "hatch-build-scripts>=1.0.0,<2", "docutils>=0.22.4,<0.23"]
build-backend = "hatchling.build"

# Generate manuals in the isolated build environment, not at installation time.
# Only shared-data exports them; build-script artifacts would duplicate them.
[[tool.hatch.build.targets.wheel.hooks.build-scripts.scripts]]
work_dir = "docs/man"
# Keep artifact traversal away from concurrently changing .uv-cache contents.
out_dir = "docs/man"
clean_artifacts = false
clean_out_dir = false
artifacts = []
commands = [
    "rst2man --config=docutils.conf --output=git-donkey.1 git-donkey.rst",
    "rst2man --config=docutils.conf --output=git-track.1 git-track.rst",
    "rst2man --config=docutils.conf --output=git-fafo.1 git-fafo.rst",
    "rst2man --config=docutils.conf --output=git-plonk.1 git-plonk.rst",
    "rst2man --config=docutils.conf --output=git-donkey-template.1 git-donkey-template.rst",
]

[tool.hatch.build.targets.wheel.shared-data]
"docs/man/git-donkey.1" = "share/man/man1/git-donkey.1"
"docs/man/git-track.1" = "share/man/man1/git-track.1"
"docs/man/git-fafo.1" = "share/man/man1/git-fafo.1"
"docs/man/git-plonk.1" = "share/man/man1/git-plonk.1"
"docs/man/git-donkey-template.1" = "share/man/man1/git-donkey-template.1"

[tool.hatch.build.targets.sdist]
# The default source selection includes docs/man/*.rst and docutils.conf.
# A wheel rebuilt from the sdist must regenerate, not reuse, these outputs.
exclude = ["/docs/man/*.1"]
