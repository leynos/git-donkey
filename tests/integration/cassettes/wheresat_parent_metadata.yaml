      string: "{\"url\":\"https://api.github.com/repos/leynos/git-donkey/pulls/82\",\"id\":4521789800,\"node_id\":\"PR_kwDOQ7SZj88AAAABDYUJaA\",\"html_url\":\"https://github.com/leynos/git-donkey/pull/82\",\"diff_url\":\"https://github.com/leynos/git-donkey/pull/82.diff\",\"patch_url\":\"https://github.com/leynos/git-donkey/pull/82.patch\",\"issue_url\":\"https://api.github.com/repos/leynos/git-donkey/issues/82\",\"number\":82,\"state\":\"open\",\"locked\":false,\"title\":\"Add
        `git wheresat` and a shared stack record across three commands\",\"user\":{\"login\":\"leynos\",\"id\":746767,\"node_id\":\"MDQ6VXNlcjc0Njc2Nw==\",\"avatar_url\":\"https://avatars.githubusercontent.com/u/746767?v=4\",\"gravatar_id\":\"\",\"url\":\"https://api.github.com/users/leynos\",\"html_url\":\"https://github.com/leynos\",\"followers_url\":\"https://api.github.com/users/leynos/followers\",\"following_url\":\"https://api.github.com/users/leynos/following{/other_user}\",\"gists_url\":\"https://api.github.com/users/leynos/gists{/gist_id}\",\"starred_url\":\"https://api.github.com/users/leynos/starred{/owner}{/repo}\",\"subscriptions_url\":\"https://api.github.com/users/leynos/subscriptions\",\"organizations_url\":\"https://api.github.com/users/leynos/orgs\",\"repos_url\":\"https://api.github.com/users/leynos/repos\",\"events_url\":\"https://api.github.com/users/leynos/events{/privacy}\",\"received_events_url\":\"https://api.github.com/users/leynos/received_events\",\"type\":\"User\",\"user_view_type\":\"public\",\"site_admin\":false},\"body\":\"##
        What this is\\n\\nA draft execution plan for a new read-only `git wheresat`
        subcommand **and a\\nshared stack record that `git donkey`, `git plonk`, and
        `git wheresat` all\\nagree on**. It is documentation only \u2014 no production
        code, no tests, no\\n`pyproject.toml` changes. The plan is\\n[`docs/execplans/git-wheresat-sub-command.md`](https://github.com/leynos/git-donkey/blob/git-wheresat-sub-command/docs/execplans/git-wheresat-sub-command.md).\\n\\n##
        The problem\\n\\nWhen a stacked parent branch is squash-merged, the child
        branch is stranded:\\nits history still holds the parent's original commits,
        which no longer have\\nany ancestry relationship to the squash commit on the
        trunk. The repair is\\n`git rebase --onto TARGET OLD_BASE CHILD`, and the
        hard part is establishing\\n`OLD_BASE` \u2014 the exclusive replay boundary.
        Getting it wrong silently\\nduplicates or silently discards work.\\n\\n`git
        wheresat` automates the discovery, and \u2014 importantly \u2014 refuses to
        answer\\nwhen the surviving evidence cannot settle the question.\\n\\n## The
        three commands currently work against each other\\n\\n`git donkey` creates
        a stacked branch, freezes the base commit at\\n`git_donkey/donkey_worktrees.py:186`,
        and then passes `--no-track` so nothing\\nrecords it \u2014 the fact the forensic
        ladder exists to reconstruct is discarded\\nmilliseconds after it is known.
        `git plonk --hard` then deletes completed\\nbranches with `git branch -D`
        (`git_donkey/plonk.py:182`), destroying the\\nbranch ref, its reflog, and
        \u2014 measured, not assumed \u2014 the entire\\n`branch.<name>` configuration
        section.\\n\\nThe plan now **requires** a single shared artefact, the **stack
        record**,\\nwith one format module, one store module, and one lifecycle:\\n\\n-
        **Birth \u2014 `git donkey`** writes the record when the base is not the trunk.\\n-
        **Life \u2014 `git wheresat`** reads it as attested evidence and refreshes
        it\\n  under `--record`.\\n- **Death \u2014 `git plonk`** converts it to a
        tombstone before deleting the\\n  branch, sweeps records orphaned by a plain
        `git branch -d`, and prunes\\n  tombstones after 90 days.\\n\\nNeither `git
        donkey` nor `git plonk` learns anything about pull requests,\\nsquash merges,
        or evidence tiers. The storage split \u2014 configuration holds the\\nvalues,
        the ref is a reachability anchor \u2014 was forced by measurement:\\n`git
        branch -D` destroys the configuration section, while `git branch -m`\\ncarries
        it and leaves the ref behind.\\n\\n`git donkey`'s record write (EP-M3) and
        `git plonk`'s lifecycle ownership\\n(EP-M4) each ship standalone value before
        `git wheresat` exists at all.\\n\\n## What the plan commits to\\n\\n- **Read-only
        by construction.** Read-only Git queries and ref writing live\\n  behind separate
        protocols in separate modules, and the writing object is\\n  not constructed
        on the default path. The only writes are refs under\\n  `refs/wheresat/`,
        plus an opt-in local receipt behind `--record`.\\n- **Tiered evidence.** `ATTESTED`
        evidence may establish a boundary alone;\\n  `DERIVED` (merge-base, fork-point)
        needs a second independent candidate\\n  naming the same commit; `INFERRED`
        (tree and patch comparison) can never\\n  establish one. The assessment result
        is a discriminated union whose\\n  established arm cannot hold an inferred
        candidate, so that rule is a type\\n  error rather than a convention.\\n-
        **Eight gates, each with a specified decision procedure**, and a\\n  verification
        obligation that each gate has a test in which that gate alone\\n  fails against
        a real repository \u2014 so a gate implemented as an\\n  unconditional pass
        is caught.\\n- **Four exit codes**: established, unresolved, usage or environment
        error,\\n  and indeterminate. A Git or GitHub error is never collapsed into
        a negative\\n  answer.\\n- **Every unbounded operation bounded**: the commit-to-pull-request\\n
        \ association search, the heuristic trunk window, reflog reads, the candidate\\n
        \ set, report rendering, HTTP timeouts, and a whole-command network budget.\\n-
        **Ten milestones**, each a coherent plateau. EP-M1 writes the two design\\n
        \ documents and two ADRs before any types exist; EP-M2 builds the shared\\n
        \ contract; EP-M3 and EP-M4 wire the two existing commands; EP-M5 builds the\\n
        \ hardest fixture; EP-M8 is a deliberate release boundary that may be merged\\n
        \ as its own pull request.\\n- **Three lifecycle invariants**: the record
        namespace stays a subset of the\\n  branch namespace; the lifecycle is a total
        single-owner state machine\\n  (a Hypothesis `RuleBasedStateMachine`, because
        this is the one place\\n  operation history determines correctness); and a
        record means the branch is\\n  stacked.\\n\\n## How it was produced\\n\\nRepository
        reconnaissance was done by four parallel read-only agents. The\\nfirst draft
        was then stress-tested by a six-lens expert design review\\n(structure, alternatives,
        scaling, contracts, failure modes, long-term\\nviability) and substantially
        revised. `## Revision note` at the end of the\\nplan lists what changed and
        why; the most consequential were:\\n\\n- the content comparison was **wrong**
        \u2014 a squash is an N-to-1 relationship,\\n  so the first draft's per-commit
        patch comparison would only ever have\\n  matched a single-commit parent;\\n-
        fork-point was classified as establishing evidence despite being the\\n  design's
        highest-likelihood hazard;\\n- cassettes were to be hand-authored, which `docs/developers-guide.md:557`\\n
        \ forbids;\\n- observability was absent from a package where every other command
        records.\\n\\nPrior art was checked live rather than from memory: git-machete's\\n`squashMergeDetection`
        modes, `github/gh-stack`, Graphite, git-branchless,\\nGerrit `Change-Id`,
        and Jujutsu change IDs. GitHub's native stacked pull\\nrequests were verified
        against the live API from this worktree \u2014\\n`GET /repos/{owner}/{repo}/stacks`
        exists, and the pull request payload\\ncarries a `stack` field that `github3.py`
        4.0.1 does not model.\\n\\n## Notes for the reviewer\\n\\n- **There is no
        roadmap document in this repository.** The standing\\n  instruction to mark
        a roadmap entry as done on completion therefore has no\\n  target. The plan
        records this in `Surprises & discoveries` and in a\\n  tolerance.\\n- Scope
        grew when the shared contract became a requirement: the tolerance is\\n  now
        sixteen files and 1,800 lines, with a continue-or-cut checkpoint at\\n  1,200.
        The change spans three commands.\\n- The honest limitation of tombstones is
        stated rather than glossed: a\\n  tombstone preserves the tip, not the reflog,
        so fork-point recovery on a\\n  deleted branch is still lost. That is acceptable
        because the tip is what\\n  the gates and the merge-base rung actually need.\\n-
        Remaining follow-ups are cross-clone recovery (pushing the anchor ref),\\n
        \ preserving superseded parent incarnations, and commit-message trailers.\\n-
        The plan is a draft awaiting approval; the ExecPlan skill's approval gate\\n
        \ applies before any implementation begins.\\n\\n## Gates\\n\\n`make markdownlint`
        and `make nixie` pass for this documentation-only change.\\n\\n## References\\n\\n-
