        the estate Markdown formatting baseline\",\"user\":{\"login\":\"leynos\",\"id\":746767,\"node_id\":\"MDQ6VXNlcjc0Njc2Nw==\",\"avatar_url\":\"https://avatars.githubusercontent.com/u/746767?v=4\",\"gravatar_id\":\"\",\"url\":\"https://api.github.com/users/leynos\",\"html_url\":\"https://github.com/leynos\",\"followers_url\":\"https://api.github.com/users/leynos/followers\",\"following_url\":\"https://api.github.com/users/leynos/following{/other_user}\",\"gists_url\":\"https://api.github.com/users/leynos/gists{/gist_id}\",\"starred_url\":\"https://api.github.com/users/leynos/starred{/owner}{/repo}\",\"subscriptions_url\":\"https://api.github.com/users/leynos/subscriptions\",\"organizations_url\":\"https://api.github.com/users/leynos/orgs\",\"repos_url\":\"https://api.github.com/users/leynos/repos\",\"events_url\":\"https://api.github.com/users/leynos/events{/privacy}\",\"received_events_url\":\"https://api.github.com/users/leynos/received_events\",\"type\":\"User\",\"user_view_type\":\"public\",\"site_admin\":false},\"body\":\"##
        Summary\\n\\nThis branch adopts the estate Markdown formatting baseline that
        concordat now audits as the `markdown-formatting-baseline` rule package (PD-002
        to PD-006), following the `leynos/netsuke` reference wiring. `make fmt` calls
        `mdtablefix` and `markdownlint-cli2 --fix` directly over the Git-selected
        Markdown set instead of the `mdformat-all` wrapper, `make check-fmt` runs
        the matching `mdtablefix --check` so unformatted Markdown fails CI, `.markdownlint-cli2.jsonc`
        carries every baseline ignore glob, and CI lints Markdown through the pinned
        `DavidAnson/markdownlint-cli2-action`. The tracked Markdown is reformatted
        once because `--git` also reaches the hidden `.rules/` documents the wrapper
        skipped.\\n\\n## Review walkthrough\\n\\n- Start with [Makefile](https://github.com/leynos/git-donkey/blob/markdown-formatting-baseline/Makefile#L1)
        for the `MDTABLEFIX` variables and the `fmt` and `check-fmt` recipes.\\n-
        Then [.github/workflows/ci.yml](https://github.com/leynos/git-donkey/blob/markdown-formatting-baseline/.github/workflows/ci.yml#L33):
        the pinned mdtablefix install replaces the `npm install`, and the action step
        follows `make check-fmt`.\\n- Finish with [.markdownlint-cli2.jsonc](https://github.com/leynos/git-donkey/blob/markdown-formatting-baseline/.markdownlint-cli2.jsonc#L13);
        the remaining files are the one-off `mdtablefix` reformat.\\n\\n## Validation\\n\\n```text\\nconcordat
        artefact rule run markdown-formatting-baseline --repo .\\nmarkdown-formatting-baseline:
        compliant\\n\\nmdtablefix --check --git --include-untracked --wrap --renumber
        --breaks --ellipsis --fences\\nmarkdownlint-cli2 \\\"**/*.md\\\"   Summary:
        0 error(s)\\nmbake validate Makefile       Valid syntax\\n```\\n\\n## Notes\\n\\nPart
        of the estate rollout driven by leynos/concordat#168; behaviour is guarded
        by that rule, so no repository-local tests are added.\\n\\n## Summary by Sourcery\\n\\nAdopt
        the estate Markdown formatting baseline across local tooling, CI, configuration,
        and repository documentation.\\n\\nEnhancements:\\n- Adopt the estate Markdown
        formatting baseline and apply its rules consistently across tracked and untracked
        Markdown files.\\n- Replace the Markdown formatting wrapper with direct table
        formatting and lint-fix targets, while adding matching formatting checks.\\n-
        Centralize baseline Markdown lint exclusions in the markdownlint configuration.\\n\\nCI:\\n-
        Pin and install mdtablefix in CI and lint Markdown through the pinned markdownlint-cli2
        GitHub Action.\\n\\nChores:\\n- Reformat the repository's Markdown documents
