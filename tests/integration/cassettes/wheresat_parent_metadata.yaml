    body:
      string: "{\"url\":\"https://api.github.com/repos/microsoft/vscode/pulls/335346\",\"id\":4488981653,\"node_id\":\"PR_kwDOAn8RLM8AAAABC5BslQ\",\"html_url\":\"https://github.com/microsoft/vscode/pull/335346\",\"diff_url\":\"https://github.com/microsoft/vscode/pull/335346.diff\",\"patch_url\":\"https://github.com/microsoft/vscode/pull/335346.patch\",\"issue_url\":\"https://api.github.com/repos/microsoft/vscode/issues/335346\",\"number\":335346,\"state\":\"open\",\"locked\":false,\"title\":\"Document
        the UI composition ownership heuristic\",\"user\":{\"login\":\"chryw\",\"id\":7075677,\"node_id\":\"MDQ6VXNlcjcwNzU2Nzc=\",\"avatar_url\":\"https://avatars.githubusercontent.com/u/7075677?v=4\",\"gravatar_id\":\"\",\"url\":\"https://api.github.com/users/chryw\",\"html_url\":\"https://github.com/chryw\",\"followers_url\":\"https://api.github.com/users/chryw/followers\",\"following_url\":\"https://api.github.com/users/chryw/following{/other_user}\",\"gists_url\":\"https://api.github.com/users/chryw/gists{/gist_id}\",\"starred_url\":\"https://api.github.com/users/chryw/starred{/owner}{/repo}\",\"subscriptions_url\":\"https://api.github.com/users/chryw/subscriptions\",\"organizations_url\":\"https://api.github.com/users/chryw/orgs\",\"repos_url\":\"https://api.github.com/users/chryw/repos\",\"events_url\":\"https://api.github.com/users/chryw/events{/privacy}\",\"received_events_url\":\"https://api.github.com/users/chryw/received_events\",\"type\":\"User\",\"user_view_type\":\"public\",\"site_admin\":false},\"body\":\"##
        Predictable UI composition \u2014 2 of 3: candidate authoring guidance\\n\\nStack:\\n\\n1.
        **#335345 \u2014 shared composition token foundation**\\n2. **#335346 \u2014
        ownership guidance (this PR)**\\n3. **#335350 \u2014 `WorkbenchButtonBar`
        pilot**\\n\\n## Proposed guidance\\n\\nUse **one relationship, one owner**
        as a review heuristic:\\n\\n- Put a relationship in the lowest component contract
        that understands all participating elements.\\n- Treat ownership as responsibility,
        not as the location of the CSS declaration.\\n- Keep primitive content neutral
        about unknown neighbors.\\n- Let a rendered icon own size/fitting, a control
        own internal relationships, and a parent own relationships between controls\u2014unless
        the actual composition provides a better boundary.\\n- Choose `gap`, padding,
        or a pair-specific margin according to the relationship; no mechanism is inherently
        correct.\\n\\nThe design-philosophy wording explicitly marks this as candidate
        guidance, not settled doctrine or an automatic lint rule.\\n\\n## Prior-art
        and scope check\\n\\n`IconLabel` is relevant prior art: `Button` already shares
        its lower-level inline-icon renderer, while the full widget has different
        resource/list-label semantics. This guidance and the active pilot therefore
        do not require embedding it or adding a new `IconLabel` API.\\n\\nMutable
        size-token IDs and values are sourced from `baseSizes.ts`; theme colors remain
        governed by their separate color registries. Broader instruction/skill source-of-truth
        consolidation remains tracked in #335370; this PR only avoids duplicating
        the spacing values it changes.\\n\\n## Validation\\n\\n- Guidance consistently
        labels the ownership model and unproven size roles as candidates.\\n- The
        active implementation pilot is limited to #335350.\\n- The active three-PR
        stack changes only eight intentional button fixtures in a 542-fixture latest-main
        comparison; 534 are pixel-identical.\\n- Editor diagnostics and `git diff
        --check` are clean.\\n\\n## Decision requested\\n\\n- Is the heuristic useful
        without being overly prescriptive?\\n- Which wording is mature enough for
