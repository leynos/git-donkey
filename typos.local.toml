# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]

[patterns]
# The shared dictionary no longer blanket-ignores inline code spans, so
# deliberate US spellings quoted as external API names need naming here.
# documentation-style-guide.md cites `color` as the canonical example of
# keeping US spelling for an external API.
ignore = ["`color`"]

[files]
exclude = []
