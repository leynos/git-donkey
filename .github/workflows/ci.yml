name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      # Least privilege: this job only reads repository contents.
      contents: read
    env:
      MAKEUTIL_REVISION: '29fc5a1634ffbaa18a773eed9dff1b2838a45d9c'
      MAKEUTIL_TOOLCHAIN: 'nightly-2026-05-28'
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install CLI tools
        run: |
          # ty is not installed here: the Makefile pins TY_VERSION and runs it
          # through uv, so that pin is the single source of truth.
          for tool in mbake pyscn; do uv tool install ${tool}; done
          # Pin Ruff so CI matches local runs; keep in sync with Makefile RUFF_VERSION.
          uv tool install ruff==0.16.6

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@c5a54701c8603a0fa756a6b34c49bc2af75a6c11
        with:
          version: "0.6.0"

      - name: Cache Makefile parser
        id: makeutil-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/bin/makeutil
          key: makeutil-${{ runner.os }}-${{ runner.arch }}-${{ env.MAKEUTIL_TOOLCHAIN }}-${{ env.MAKEUTIL_REVISION }}

      - name: Install Makefile parser
        if: steps.makeutil-cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install "${MAKEUTIL_TOOLCHAIN}" --profile minimal
          RUSTFLAGS="-Zpolonius=next" cargo +"${MAKEUTIL_TOOLCHAIN}" install \
            --git https://github.com/leynos/makeutil \
            --rev "${MAKEUTIL_REVISION}" \
            --locked \
            --force \
            makeutil

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Check formatting
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make
        # markdownlint`. Spelling stays in `make spelling` below.
        uses: DavidAnson/markdownlint-cli2-action@4580e1612f6407034edd6c0e4e316d725920867b  # v24.2.0
        with:
          globs: '**/*.md'

      - name: Check spelling
        run: make spelling

      - name: Run lint and dead-code detection
        run: make lint

      - name: Run typechecker
        run: make typecheck

      - name: Run tests with coverage
        # Pull requests consume the ratchet baseline main writes. They do not
        # need a CodeScene token, CodeScene CLI, or a full Git checkout.
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@152d9c4784d0ae5877938a984fe6d1f04d718fd8
        with:
          language: python
          python-source: ./git_donkey
          output-path: coverage.xml
          format: cobertura
          pytest-workers: ''
          with-ratchet: 'true'
