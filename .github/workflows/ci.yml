name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      # Least privilege: this job only reads repository contents.
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install CLI tools
        run: |
          # ty is not installed here: the Makefile pins TY_VERSION and runs it
          # through uv, so that pin is the single source of truth.
          for tool in mbake pyscn; do uv tool install ${tool}; done
          # Pin Ruff so CI matches local runs; keep in sync with Makefile RUFF_VERSION.
          uv tool install ruff==0.16.6

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@ff1dd759dfffc0db3459e30e833f52437ee62b57
        with:
          version: "0.6.0"

      - name: Install makeutil
        id: makeutil
        # A digest-verified prebuilt release, cached by the action itself,
        # rather than a from-source build.
        uses: leynos/shared-actions/.github/actions/install-makeutil@ebe2f3105334283441f4c915eb979a0f4b9f2c04

      - name: Verify makeutil
        # Prove the installed binary runs, matches the release the action
        # reports, and reads this repository's Makefile completely.
        shell: bash
        env:
          INSTALLED_VERSION: ${{ steps.makeutil.outputs.version }}
        run: |
          set -euo pipefail
          test "$(makeutil --version)" = "makeutil ${INSTALLED_VERSION}"
          makeutil parse Makefile | python3 -c \
            'import json, sys; assert json.load(sys.stdin)["parse"]["status"] == "complete"'

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Check formatting
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make
        # markdownlint`. Spelling stays in `make spelling` below.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'

      - name: Check spelling
        run: make spelling

      - name: Run lint and dead-code detection
        run: make lint

      - name: Run typechecker
        run: make typecheck

      - name: Check the CV-005 contracts
        run: make test-workflow-contracts

      # Coverage runs on pull requests only, ratcheting against the
      # baseline coverage-main.yml writes on pushes to main; that workflow
      # is also the only one that uploads to CodeScene. Nothing here
      # publishes the report.
      - name: Run tests with coverage
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@ff1dd759dfffc0db3459e30e833f52437ee62b57
        # Pinned to the interpreter setup-python installs, in both lanes:
        # the action builds its coverage environment with whatever
        # interpreter uv finds first, which an earlier step's managed
        # download can change, and a baseline measured on one Python is
        # not comparable with a lane measured on another.
        env:
          UV_PYTHON: '3.13'
        with:
          output-path: coverage.xml
          format: cobertura
          with-ratchet: 'true'
          publish-artefact: 'false'
