name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      # Surface the secret as an env var so the CodeScene gate can test it:
      # GitHub Actions does not allow `secrets.*` in step-level `if:`.
      CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
      MAKEUTIL_REVISION: '29fc5a1634ffbaa18a773eed9dff1b2838a45d9c'
      MAKEUTIL_TOOLCHAIN: 'nightly-2026-05-28'
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install CLI tools
        run: |
          for tool in mbake pyscn; do uv tool install ${tool}; done
          # Pin Ruff so CI matches local runs; keep in sync with Makefile RUFF_VERSION.
          uv tool install ruff==0.15.12
          npm install -g markdownlint-cli2

      - name: Install Makefile parser
        run: |
          rustup toolchain install "${MAKEUTIL_TOOLCHAIN}" --profile minimal
          RUSTFLAGS="-Zpolonius=next" cargo +"${MAKEUTIL_TOOLCHAIN}" install \
            --git https://github.com/leynos/makeutil \
            --rev "${MAKEUTIL_REVISION}" \
            --locked \
            --force \
            makeutil

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Check formatting
        run: make check-fmt

      - name: Check spelling
        run: make spelling

      - name: Run lint and dead-code detection
        run: make lint

      - name: Run typechecker
        run: make typecheck

      - name: Run tests with coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@dae5d4205c5b3b9f5ad37fddfc8d87276f7ea874
        with:
          output-path: coverage.xml
          format: cobertura

      - name: Upload coverage to CodeScene
        if: env.CS_ACCESS_TOKEN != ''
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@dae5d4205c5b3b9f5ad37fddfc8d87276f7ea874
        with:
          path: coverage.xml
          format: cobertura
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}
