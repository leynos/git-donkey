name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      # Surface the secret as an env var so the CodeScene gate can test it:
      # GitHub Actions does not allow `secrets.*` in step-level `if:`.
      CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install CLI tools
        run: |
          for tool in mbake ty pyscn; do uv tool install ${tool}; done
          # Pin Ruff so CI matches local runs; keep in sync with Makefile RUFF_VERSION.
          uv tool install ruff==0.15.12
          npm install -g markdownlint-cli2

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Check formatting
        run: make check-fmt

      - name: Check spelling
        run: make spelling

      - name: Run ruff
        run: make lint

      - name: Run typechecker
        run: make typecheck

      - name: Run tests with coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@3c1fa01bcf4c26dac79975c18b74c01d577dcf95
        with:
          output-path: coverage.xml
          format: cobertura

      - name: Upload coverage to CodeScene
        if: env.CS_ACCESS_TOKEN != ''
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@80935e57261986b39b958d7873435a50f14d592e
        with:
          path: coverage.xml
          format: cobertura
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}
