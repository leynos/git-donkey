---
name: Release Wheels

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  # Queue rather than cancel. A re-pushed tag that cancelled the running
  # release could stop it part-way through an upload. The queued run then
  # starts from a complete state, and the reconciliation below makes it safe to
  # repeat.
  cancel-in-progress: false

# Every job declares exactly what it needs, so nothing inherits a write scope.
permissions: {}

# Each filename's canonical bytes are the ones already published: PyPI's
# first, then a GitHub asset with verified build provenance. This run's
# attested file stays in place when its digest matches GitHub's; an unverified
# differing asset stops PyPI staging. Each destination receives only names it
# lacks, never overwriting, and `publish-release` checks both hold the same
# digests before the release becomes visible. The attached attestation bundle
# is assembled from the store after upload, so it covers every published file,
# including bytes carried from an earlier run. The decisions live in
# `scripts/release_assets.py`; network calls stay in these steps.
jobs:
  # Runs beside the build rather than before it, so the paid build lane never
  # queues behind a hosted job; every job that attests, uploads, or releases
  # waits on it instead.
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.pyproject-version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The tag loses its leading `v` and is compared with the manifest as a
      # string, so `v0.2.0-beta1` matches `0.2.0-beta1` and any other spelling
      # fails.
      - name: Check the pyproject.toml version against the tag
        id: pyproject-version
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/release_version.py
      # Checked first here so a runner with an old CLI fails before the PyPI
      # upload, rather than after it, when only a draft Release is left to fix.
      - name: Check the GitHub CLI version
        id: gh-version
        run: |
          set -euo pipefail
          gh --version | python3 scripts/release_gh_version.py

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The local composite action must be present before it can run; its own
      # checkout then builds the pinned commit with credentials disabled.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build distributions
        uses: ./.github/actions/pure-python-wheel
        with:
          python-version: '3.13'
          artifact-name: wheels-pure

  # Attests exactly the files this run built, before anything leaves the run,
  # and hands them on as one artefact. Bytes a later job carries over from an
  # earlier run were attested by that run; every run's attestation stays in
  # the repository's attestation store, and the release's attached bundle is
  # assembled from those records under a run-unique name.
  attest:
    needs:
      - check-version
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: wheels-*
          path: dist
      - name: Collect release artefacts
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist/publish
          find dist -path dist/publish -prune -o -type f \
            \( -name "*.whl" -o -name "*.tar.gz" \) -print0 | \
            xargs -0 -r -I {} cp {} dist/publish/
          shopt -s nullglob
          wheels=(dist/publish/*.whl)
          sdists=(dist/publish/*.tar.gz)
          if [ "${#sdists[@]}" -ne 1 ]; then
            echo "Expected exactly one source distribution." >&2
            ls -al dist/publish >&2
            exit 1
          fi
          if [ "${#wheels[@]}" -eq 0 ]; then
            echo "Expected at least one wheel." >&2
            ls -al dist/publish >&2
            exit 1
          fi
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/publish/*
      - name: Stage the provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir -p dist/attestations
          bundle="git-donkey-${GITHUB_REF_NAME}-run${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cp "${BUNDLE_PATH}" "dist/attestations/${bundle}.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-dist
          path: |
            dist/publish
            dist/attestations
          # A re-run replaces the previous attempt's artefact; the run-unique
          # bundle name already keeps attempts distinguishable.
          overwrite: true
          if-no-files-found: error

  # Creates or reuses the draft and snapshots its assets, so the PyPI job can
  # carry GitHub's bytes over without a GitHub token of its own. A draft is
  # visible only to a token that can write contents.
  draft-release:
    needs:
      - check-version
      - attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - &scripts-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
      # A re-pushed tag must not publish bytes built for an earlier commit.
      - &tag-commit-check
        name: Check the tag still points to this run's commit
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}^{}" | cut -f1)"
          if [ -z "${tag_commit}" ]; then
            tag_commit="$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}" | cut -f1)"
          fi
          if [ "${tag_commit}" != "${GITHUB_SHA}" ]; then
            echo "::error title=tag-moved::Tag ${GITHUB_REF_NAME} points to ${tag_commit}," \
              "not this run's ${GITHUB_SHA}." >&2
            exit 1
          fi
      - &release-dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Create or reuse the draft release
        id: create
        env:
          IS_PRERELEASE: ${{ needs.check-version.outputs.prerelease }}
        run: |
          set -euo pipefail
          # A re-run reuses whatever release the tag already has, draft or not.
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "Reusing the existing release for ${GITHUB_REF_NAME}."
            exit 0
          fi
          flags=(--draft --verify-tag --generate-notes --title "${GITHUB_REF_NAME}")
          if [ "${IS_PRERELEASE}" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${flags[@]}"

      # The bounded index lookup shared by every reconciliation job. The
      # runner's curl cannot report `%{num_retries}`, so the loop retries a
      # network error, 429, or 5xx itself and counts the attempts.
      - name: Fetch the PyPI index
        id: index
        run: &fetch-index |
          set -euo pipefail
          attempt=0
          status=000
          while [ "${attempt}" -lt 6 ]; do
            attempt=$((attempt + 1))
            status=$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 60 \
              --output pypi-index.json --write-out '%{http_code}' \
              --header 'Accept: application/vnd.pypi.simple.v1+json' \
              https://pypi.org/simple/git-donkey/) || status=000
            case "${status}" in
              000|429|5??) [ "${attempt}" -lt 6 ] && sleep 2 ;;
              *) break ;;
            esac
          done
          printf 'attempts=%s\nstatus=%s\n' "${attempt}" "${status}" >> "${GITHUB_OUTPUT}"
          case "${status}" in
            200) ;;
            404) echo '{"files": []}' > pypi-index.json ;;
            *)
              echo "PyPI simple index returned HTTP ${status}." >&2
              exit 1
              ;;
          esac
      # A published release that no longer matches the canonical bytes must not
      # stay visible while reconciliation runs or fails.
      - name: Check whether an already published release is complete
        id: redraft
        run: |
          set -euo pipefail
          # This job's first verifier call must run on a CLI that enforces the
          # identity flags, whatever version the runner image carries.
          gh --version | python3 scripts/release_gh_version.py
          gh release view "${GITHUB_REF_NAME}" --json isDraft,assets > draft-state.json
          if [ "$(jq -r '.isDraft' draft-state.json)" = true ]; then
            echo "published=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "published=true" >> "${GITHUB_OUTPUT}"
          jq '{assets: .assets}' draft-state.json > draft-assets.json
          mkdir -p github-state/files release-bundles
          # Destination digests decide before any bundle download: a confirmed
          # mismatch redrafts even when a download or verifier is unavailable.
          python3 -m scripts.release_assets_cli destinations-complete --publish dist/publish \
            --index pypi-index.json --assets draft-assets.json
          digests_complete="$(grep '^complete=' "${GITHUB_OUTPUT}" | tail -1 | cut -d= -f2)"
          if [ "${digests_complete}" != true ]; then
            exit 0
          fi
          # Coverage reads only the combined bundle; a legacy single-run
          # bundle cannot contribute and must not block the check by failing
          # to download.
          if jq -e '.assets[] | select(.name | endswith(".attestations.jsonl"))' draft-assets.json > /dev/null; then
            gh release download "${GITHUB_REF_NAME}" --pattern '*.attestations.jsonl' --dir release-bundles
          fi
          # Destination metadata decides first: a digest mismatch, missing
          # asset or uncovered distribution is a confirmed incomplete release
          # even when a bundle cannot be verified.
          python3 -m scripts.release_assets_cli release-complete --publish dist/publish \
            --index pypi-index.json --assets draft-assets.json --output github-state/files \
            --bundles release-bundles
          complete="$(grep '^complete=' "${GITHUB_OUTPUT}" | tail -1 | cut -d= -f2)"
          if [ "${complete}" = true ]; then
            # Select the bundles that cover the release and verify one of them
            # for every distribution. A failure here is inconclusive, not proof
            # that the release is incomplete, so it must not edit the release.
            covering=()
            for candidate in release-bundles/*.attestations.jsonl; do
              [ -e "${candidate}" ] || continue
              single="$(mktemp -d)"
              cp "${candidate}" "${single}/"
              GITHUB_OUTPUT="${single}/output" python3 -m scripts.release_assets_cli bundle-coverage \
                --publish dist/publish --assets draft-assets.json --bundles "${single}"
              candidate_covered="$(grep '^covered=' "${single}/output" 2>/dev/null | tail -1 | cut -d= -f2)"
              rm -rf "${single}"
              if [ "${candidate_covered}" = true ]; then
                covering+=("${candidate}")
              fi
            done
            if [ "${#covering[@]}" -eq 0 ]; then
              echo "::error title=bundle-coverage::No covering bundle could be selected." >&2
              exit 1
            fi
            verified_bundle=""
            for bundle in "${covering[@]}"; do
              bundle_ok=true
              while IFS= read -r name; do
                [ -n "${name}" ] || continue
                work="$(mktemp -d)"
                gh release download "${GITHUB_REF_NAME}" --pattern "${name}" --dir "${work}"
                verified=false
                for attempt in 1 2 3; do
                  if gh attestation verify "${work}/${name}" \
                    --bundle "${bundle}" \
                    --repo "${GITHUB_REPOSITORY}" \
                    --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
                    --source-ref "${GITHUB_REF}" \
                    --source-digest "${GITHUB_SHA}" \
                    --deny-self-hosted-runners > /dev/null; then
                    verified=true
                    break
                  fi
                  if [ "${attempt}" -lt 3 ]; then
                    sleep "$((attempt * 2))"
                  fi
                done
                rm -rf "${work}"
                if [ "${verified}" != true ]; then
                  bundle_ok=false
                  break
                fi
              done <<< "$(jq -r '.assets[].name | select((. | endswith(".attestations.jsonl") or endswith(".sigstore.json")) | not)' draft-assets.json)"
              if [ "${bundle_ok}" = true ]; then
                verified_bundle="${bundle}"
                break
              fi
            done
            if [ -z "${verified_bundle}" ]; then
              echo "::error title=bundle-verification::No covering bundle verified for the release." >&2
              exit 1
            fi
          fi
      # An inconclusive check must not change a published release: the edit
      # runs only for a confirmed incomplete verdict. A release this run found
      # incomplete is returned to draft and repaired; publish-release verifies
      # its provenance before it becomes visible again, so failing here would
      # block the repair this run just enabled. A complete release must still
      # carry provenance for this tag and commit.
      - name: Verify published release provenance
        id: provenance
        if: >-
          steps.redraft.outputs.published == 'true'
          && steps.redraft.outputs.complete == 'true'
        run: |
          set -euo pipefail
          while IFS= read -r name; do
            [ -n "${name}" ] || continue
            work="$(mktemp -d)"
            gh release download "${GITHUB_REF_NAME}" --pattern "${name}" --dir "${work}"
            if ! gh attestation verify "${work}/${name}" \
              --repo "${GH_REPO}" \
              --signer-workflow "${GH_REPO}/.github/workflows/release.yml" \
              --source-ref "${GITHUB_REF}" \
              --source-digest "${GITHUB_SHA}" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --deny-self-hosted-runners \
              --format json > "${work}/${name}.json"; then
              echo "::error title=release-provenance::${name} has no provenance for this tag and commit." >&2
              exit 1
            fi
            rm -rf "${work}"
          done <<< "$(jq -r '.assets[] | select((.name | endswith(".attestations.jsonl") or endswith(".sigstore.json")) | not) | .name' draft-assets.json)"
      - name: Return an incomplete published release to draft
        if: >-
          always()
          && steps.create.outcome == 'success'
          && steps.redraft.outputs.published == 'true'
          && steps.redraft.outputs.complete == 'false'
        run: |
          set -euo pipefail
          gh release edit "${GITHUB_REF_NAME}" --draft=true
      - name: Snapshot the release assets
        id: snapshot
        run: |
          set -euo pipefail
          mkdir -p github-state/files
          gh release view "${GITHUB_REF_NAME}" --json assets > github-state/assets.json
          python3 -m scripts.release_assets_cli carryover --publish dist/publish \
            --assets github-state/assets.json > github-state/carryover.txt
          while IFS= read -r name; do
            gh release download "${GITHUB_REF_NAME}" --pattern "${name}" \
              --dir github-state/files
          done < github-state/carryover.txt
      - name: Verify carried asset provenance
        id: attestation
        run: |
          set -euo pipefail
          carryover_file=github-state/carryover.txt
          if [ ! -f "${carryover_file}" ]; then
            echo "::error title=attestation::Carryover list is missing." >&2
            exit 1
          fi
          mkdir -p github-state/provenance
          verification_failures=0
          if [ ! -s "${carryover_file}" ]; then
            echo "verification_failures=0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # 2.102.0 fixes GHSA-wjmr-j3rp-mh2g and GHSA-4mq3-hpgx-9cx8.
          required_version=2.102.0
          gh_version="$(gh --version | awk 'NR == 1 {print $3}')"
          lowest_version="$(printf '%s\n%s\n' "${required_version}" "${gh_version}" \
            | sort -V | sed -n '1p')"
          if [ "${lowest_version}" != "${required_version}" ]; then
            echo "::error title=gh-version::GitHub CLI ${required_version} or newer is required;" \
              "found ${gh_version:-unknown}." >&2
            exit 1
          fi
          while IFS= read -r name; do
            [ -n "${name}" ] || continue
            record="github-state/provenance/${name}.json"
            verified=false
            for attempt in 1 2 3; do
              if gh attestation verify "github-state/files/${name}" \
                --repo "${GH_REPO}" \
                --signer-workflow "${GH_REPO}/.github/workflows/release.yml" \
                --source-ref "${GITHUB_REF}" \
                --source-digest "${GITHUB_SHA}" \
                --deny-self-hosted-runners \
                --format json > "${record}"; then
                verified=true
                break
              fi
              rm -f "${record}"
              if [ "${attempt}" -lt 3 ]; then
                sleep "$((attempt * 2))"
              fi
            done
            if [ "${verified}" != true ]; then
              verification_failures=$((verification_failures + 1))
              echo "::warning title=attestation::Could not verify provenance for GitHub asset ${name};" \
                "stage-pypi will reject it if PyPI needs its differing bytes."
            fi
          done < "${carryover_file}"
          echo "verification_failures=${verification_failures}" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-github-state
          path: github-state
          overwrite: true
          if-no-files-found: error

  publish-pypi:
    needs:
      - attest
      - draft-release
    # Release orchestration: it uploads the artefacts other jobs built. No
    # build work, so it stays on a GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/project/git-donkey/
    permissions:
      contents: read
      id-token: write
    steps:
      - *scripts-checkout
      - *tag-commit-check
      - *release-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-github-state
          path: github-state
      # `draft-release` and `publish-release` reuse this script through its
      # anchor. The runner's curl cannot report `%{num_retries}`, so the loop
      # retries a network error, 429, or 5xx itself and counts the attempts.
      - name: Fetch the PyPI index
        id: index
        run: *fetch-index
      # PyPI rejects a second upload of an existing filename, so names it holds
      # are dropped, and a name only the GitHub Release holds is sent with
      # GitHub's bytes rather than this run's rebuild.
      - name: Skip artefacts already on PyPI
        id: pending
        run: |
          set -euo pipefail
          python3 -m scripts.release_assets_cli stage-pypi --publish dist/publish \
            --index pypi-index.json --assets github-state/assets.json \
            --github-files github-state/files \
            --provenance github-state/provenance
      # pypa's action rather than `uv publish`: with Trusted Publishing it also
      # signs and uploads a PEP 740 attestation for every file, which uv does
      # not. `skip-existing` takes the place of uv's `--check-url`, so a file
      # an interrupted earlier attempt already uploaded is skipped, not fatal.
      - name: Publish to PyPI
        id: upload
        if: steps.pending.outputs.remaining == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/publish/
          skip-existing: true

  # Runs only once PyPI holds every artefact, so the release's missing assets
  # take PyPI's bytes, and the release stays a draft unless both destinations
  # then agree.
  publish-release:
    needs:
      - check-version
      - draft-release
      - publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - *scripts-checkout
      - *tag-commit-check
      - *release-dist
      - name: Fetch the PyPI index
        id: index
        run: *fetch-index
      - name: List the release assets
        id: assets
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" --json assets > release-assets.json
      # A combined bundle can exist and still omit a distribution a later run
      # added. Coverage, not mere existence, decides whether it must be rebuilt.
      - name: Check the attached bundle coverage
        id: coverage
        run: |
          set -euo pipefail
          # This job's first verifier call must run on a CLI that enforces the
          # identity flags, whatever version the runner image carries.
          gh --version | python3 scripts/release_gh_version.py
          mkdir -p release-bundles
          # Coverage reads only the combined bundle; a legacy single-run
          # bundle cannot contribute and must not block the check by failing
          # to download.
          if jq -e '.assets[] | select(.name | endswith(".attestations.jsonl"))' release-assets.json > /dev/null; then
            gh release download "${GITHUB_REF_NAME}" --pattern '*.attestations.jsonl' --dir release-bundles
          fi
          python3 -m scripts.release_assets_cli bundle-coverage --publish dist/publish \
            --assets release-assets.json --bundles release-bundles
          covered="$(grep '^covered=' "${GITHUB_OUTPUT}" | tail -1 | cut -d= -f2)"
          if [ "${covered}" = true ]; then
            covering=()
            for candidate in release-bundles/*.attestations.jsonl; do
              [ -e "${candidate}" ] || continue
              single="$(mktemp -d)"
              cp "${candidate}" "${single}/"
              GITHUB_OUTPUT="${single}/output" python3 -m scripts.release_assets_cli bundle-coverage \
                --publish dist/publish --assets release-assets.json --bundles "${single}"
              candidate_covered="$(grep '^covered=' "${single}/output" 2>/dev/null | tail -1 | cut -d= -f2)"
              rm -rf "${single}"
              if [ "${candidate_covered}" = true ]; then
                covering+=("${candidate}")
              fi
            done
            if [ "${#covering[@]}" -eq 0 ]; then
              echo "::error title=bundle-coverage::No covering bundle could be selected." >&2
              exit 1
            fi
            verified_bundle=""
            for bundle in "${covering[@]}"; do
              bundle_ok=true
              while IFS= read -r name; do
                [ -n "${name}" ] || continue
                work="$(mktemp -d)"
                gh release download "${GITHUB_REF_NAME}" --pattern "${name}" --dir "${work}"
                verified=false
                for attempt in 1 2 3; do
                  if gh attestation verify "${work}/${name}" \
                    --bundle "${bundle}" \
                    --repo "${GITHUB_REPOSITORY}" \
                    --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
                    --source-ref "${GITHUB_REF}" \
                    --source-digest "${GITHUB_SHA}" \
                    --deny-self-hosted-runners > /dev/null; then
                    verified=true
                    break
                  fi
                  if [ "${attempt}" -lt 3 ]; then
                    sleep "$((attempt * 2))"
                  fi
                done
                rm -rf "${work}"
                if [ "${verified}" != true ]; then
                  bundle_ok=false
                  break
                fi
              done <<< "$(jq -r '.assets[].name | select((. | endswith(".attestations.jsonl") or endswith(".sigstore.json")) | not)' release-assets.json)"
              if [ "${bundle_ok}" = true ]; then
                verified_bundle="${bundle}"
                break
              fi
            done
            if [ -z "${verified_bundle}" ]; then
              echo "::error title=bundle-verification::No covering bundle verified for the release." >&2
              exit 1
            fi
            printf 'verified_bundle=%s\n' "$(basename "${verified_bundle}")" \
              >> "${GITHUB_OUTPUT}"
            printf 'verified_digest=%s\n' \
              "$(sha256sum "${verified_bundle}" | cut -d' ' -f1)" \
              >> "${GITHUB_OUTPUT}"
          fi
      # Every missing name is fetched from PyPI, whose bytes are canonical. A
      # fully published re-run stages nothing, so the upload steps below are
      # skipped and the release is unchanged.
      - name: Stage the assets the release lacks
        id: stage
        run: |
          set -euo pipefail
          python3 -m scripts.release_assets_cli stage-github --publish dist/publish \
            --index pypi-index.json --assets release-assets.json \
            --output github-upload > pypi-fetch.tsv
          while IFS=$'\t' read -r name url; do
            curl --silent --show-error --location --fail \
              --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 10 --max-time 300 \
              --output "github-upload/${name}" "${url}"
          done < pypi-fetch.tsv
      - name: Check the fetched PyPI bytes
        id: fetched
        run: |
          set -euo pipefail
          python3 -m scripts.release_assets_cli check-fetched --publish dist/publish \
            --index pypi-index.json --assets release-assets.json --output github-upload
      # PyPI's index digest proves only that the download arrived intact, not
      # who built the bytes. The release must carry only bytes this
      # repository's workflow attested for this tag and this commit, so every
      # fetched file is verified before it is uploaded. The evidence is kept
      # outside `github-upload/` so it never becomes a release asset.
      - name: Verify provenance of PyPI bytes
        id: pypi-provenance
        run: |
          set -euo pipefail
          gh --version | python3 scripts/release_gh_version.py
          mkdir -p pypi-provenance
          failed=0
          while IFS=$'\t' read -r name _; do
            [ -n "${name}" ] || continue
            record="pypi-provenance/${name}.json"
            if ! gh attestation verify "github-upload/${name}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "${GITHUB_REF}" \
              --source-digest "${GITHUB_SHA}" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --deny-self-hosted-runners \
              --format json > "${record}"; then
              rm -f "${record}"
              echo "::error title=pypi-provenance::Could not verify build provenance" \
                "for ${name}." >&2
              failed=1
            fi
          done < pypi-fetch.tsv
          # Verify every file before stopping, so one run names every
          # unattested file rather than only the first one it meets.
          [ "${failed}" -eq 0 ] || exit 1
          python3 -m scripts.release_assets_cli check-provenance --publish dist/publish \
            --index pypi-index.json --assets release-assets.json \
            --output github-upload --provenance pypi-provenance
      # No `--clobber`: an asset the release already holds is canonical.
      - name: Upload the assets the release lacks
        id: upload
        if: steps.stage.outputs.files == 'true'
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" github-upload/*
      # The attached bundle must attest every byte the release now holds,
      # including bytes carried from an earlier run, so it is assembled from
      # the attestation store after the distributions are uploaded. A fully
      # published re-run skips this step and keeps its existing bundle.
      - name: Assemble the release attestations
        id: attestations
        if: >-
          steps.stage.outputs.pending == 'true'
          || steps.coverage.outputs.covered == 'false'
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" --json assets > release-assets.json
          mkdir -p assembled-attestations
          : > assembled-attestations/bundles.jsonl
          jq -r '.assets[].name' release-assets.json | while IFS= read -r name; do
            case "${name}" in
              *.sigstore.json|*.attestations.jsonl) continue ;;
            esac
            work="$(mktemp -d)"
            gh release download "${GITHUB_REF_NAME}" --pattern "${name}" --dir "${work}"
            # Every distribution the release will hold must be attested for
            # this tag and commit, including assets a previous run left behind.
            gh attestation verify "${work}/${name}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "${GITHUB_REF}" \
              --source-digest "${GITHUB_SHA}" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --deny-self-hosted-runners \
              --format json > "${work}/${name}.json"
            (
              cd "${work}"
              gh attestation download "$(realpath "${work}/${name}")" \
                --repo "${GITHUB_REPOSITORY}" \
                --predicate-type https://slsa.dev/provenance/v1
            )
            cat "${work}"/*.jsonl >> assembled-attestations/bundles.jsonl
            rm -rf "${work}"
          done
          # Verify every distribution against the assembled bundle itself;
          # the store check above does not prove what the download selected.
          failed=0
          while IFS= read -r name; do
            [ -n "${name}" ] || continue
            work="$(mktemp -d)"
            gh release download "${GITHUB_REF_NAME}" --pattern "${name}" --dir "${work}"
            if ! gh attestation verify "${work}/${name}" \
              --bundle assembled-attestations/bundles.jsonl \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "${GITHUB_REF}" \
              --source-digest "${GITHUB_SHA}" \
              --deny-self-hosted-runners > /dev/null; then
              echo "::error title=release-attestations::${name} is not covered by the assembled bundle." >&2
              failed=1
            fi
            rm -rf "${work}"
          done <<< "$(jq -r '.assets[].name | select((. | endswith(".attestations.jsonl") or endswith(".sigstore.json")) | not)' release-assets.json)"
          [ "${failed}" -eq 0 ] || exit 1
          bundle="git-donkey-${GITHUB_REF_NAME}-run${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.attestations.jsonl"
          cp assembled-attestations/bundles.jsonl "${bundle}"
          gh release upload "${GITHUB_REF_NAME}" "${bundle}"
          # The final check pins this exact bundle and its bytes, so an asset
          # deleted or replaced before publication cannot pass on another one.
          printf 'bundle=%s\n' "${bundle}" >> "${GITHUB_OUTPUT}"
          printf 'bundle_digest=%s\n' \
            "$(sha256sum "${bundle}" | cut -d' ' -f1)" >> "${GITHUB_OUTPUT}"
      # A complete re-run skips the assembly, so verify the existing release's
      # provenance read-only rather than downloading attestations again.
      - name: Verify release distributions
        id: release-provenance
        if: >-
          steps.stage.outputs.pending != 'true'
          && steps.coverage.outputs.covered == 'true'
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" --json assets > release-assets.json
          while IFS= read -r name; do
            [ -n "${name}" ] || continue
            work="$(mktemp -d)"
            gh release download "${GITHUB_REF_NAME}" --pattern "${name}" --dir "${work}"
            if ! gh attestation verify "${work}/${name}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "${GITHUB_REF}" \
              --source-digest "${GITHUB_SHA}" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --deny-self-hosted-runners > /dev/null; then
              echo "::error title=release-provenance::${name} lacks approved provenance." >&2
              exit 1
            fi
            rm -rf "${work}"
          done <<< "$(jq -r '.assets[].name | select((. | endswith(".attestations.jsonl") or endswith(".sigstore.json")) | not)' release-assets.json)"
      # The index fetched before staging can be minutes old once the uploads
      # and verifications finish. A file PyPI no longer serves must fail this
      # run rather than pass against a saved entry.
      - name: Refresh the PyPI index before the final check
        id: refreshed-index
        run: *fetch-index
      - name: Check both destinations hold the same bytes
        id: verify
        env:
          # The bundle this run verified: the one it assembled, or on a
          # complete re-run the covering bundle the coverage step approved.
          EXPECTED_BUNDLE: ${{ steps.attestations.outputs.bundle || steps.coverage.outputs.verified_bundle }}
          EXPECTED_DIGEST: ${{ steps.attestations.outputs.bundle_digest || steps.coverage.outputs.verified_digest }}
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" --json assets > release-assets.json
          extra=()
          if [ -n "${EXPECTED_BUNDLE:-}" ]; then
            extra+=(--expected-bundle "${EXPECTED_BUNDLE}")
            if [ -n "${EXPECTED_DIGEST:-}" ]; then
              extra+=(--expected-digest "${EXPECTED_DIGEST}")
            fi
            if [ -f "${EXPECTED_BUNDLE}" ]; then
              extra+=(--verified-bundle "${EXPECTED_BUNDLE}")
            elif [ -f "release-bundles/${EXPECTED_BUNDLE}" ]; then
              extra+=(--verified-bundle "release-bundles/${EXPECTED_BUNDLE}")
            else
              echo "::error title=bundle-verification::The verified bundle" \
                "${EXPECTED_BUNDLE} is not available." >&2
              exit 1
            fi
          fi
          python3 -m scripts.release_assets_cli verify --publish dist/publish \
            --index pypi-index.json --assets release-assets.json \
            --output github-upload "${extra[@]}"
      # Editing is skipped when the release is already visible with the right
      # pre-release flag, so a fully published re-run changes nothing.
      - name: Publish the GitHub Release
        id: publish
        env:
          IS_PRERELEASE: ${{ needs.check-version.outputs.prerelease }}
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" --json isDraft,isPrerelease \
            > release-state.json
          is_draft="$(jq -r '.isDraft' release-state.json)"
          is_prerelease="$(jq -r '.isPrerelease' release-state.json)"
          if [ "${is_draft}" = true ] || [ "${is_prerelease}" != "${IS_PRERELEASE}" ]; then
            gh release edit "${GITHUB_REF_NAME}" --draft=false \
              --prerelease="${IS_PRERELEASE}"
          fi
