name: Coverage (main)

# The single CodeScene publisher. CodeScene accepts `cs-coverage upload`
# only for analysed branches, so main's coverage is uploaded here on
# push. Pull requests generate coverage with the ratchet this workflow
# advances, and nothing a pull request runs receives CodeScene
# credentials or contacts CodeScene.
# `cv005-contracts` (the Makefile's `test-workflow-contracts` target) holds the
# shape.
#
# workflow_dispatch is the recovery path for automerged changes: a merge
# made with the automerge workflow's GITHUB_TOKEN does not fire push
# workflows, so those changes reach this publisher only through a
# dispatch or the next push.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One publisher run per ref at a time, never cancelled. GitHub keeps one
# pending run per group, so a newer push replaces an older pending run
# and never interrupts a running one; the newest baseline wins. A
# cancelled run would abandon both its upload and its ratchet baseline
# write. The group is keyed on the ref alone: a branch dispatch cannot
# displace a pending main run, and with one group for main, runs never
# overlap and the newest triggered run's coverage lands last. A manual
# re-run of an older run is an operator action that republishes that
# commit's coverage and baseline until the next push. A dispatch that
# replaces a pending push leaves the ratchet baseline one commit behind
# until the next push, because only a push saves it.
concurrency:
  group: coverage-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    runs-on: ubuntu-latest
    # The CodeScene token lives in this environment, whose deployment policy
    # admits `main` alone; the codescene_environment contract holds it to
    # this job.
    environment: codescene
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install makeutil
        id: makeutil
        # A digest-verified prebuilt release, cached by the action itself,
        # rather than a from-source build.
        uses: leynos/shared-actions/.github/actions/install-makeutil@ebe2f3105334283441f4c915eb979a0f4b9f2c04

      - name: Verify makeutil
        # Prove the installed binary runs, matches the release the action
        # reports, and reads this repository's Makefile completely.
        shell: bash
        env:
          INSTALLED_VERSION: ${{ steps.makeutil.outputs.version }}
        run: |
          set -euo pipefail
          test "$(makeutil --version)" = "makeutil ${INSTALLED_VERSION}"
          makeutil parse Makefile | python3 -c \
            'import json, sys; assert json.load(sys.stdin)["parse"]["status"] == "complete"'

      # As in ci.yml: `uv sync` builds the project, which puts the build
      # backend in uv's cache. The manpage packaging tests build offline
      # and fail without it.
      - name: Install code
        run: make build

      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@0606ca899ce2995a0c4bc78e660e80832e6e8855
        # Pinned to the interpreter setup-python installs, in both lanes:
        # the action builds its coverage environment with whatever
        # interpreter uv finds first, which an earlier step's managed
        # download can change, and a baseline measured on one Python is
        # not comparable with a lane measured on another.
        env:
          UV_PYTHON: '3.13'
        with:
          output-path: coverage.xml
          format: cobertura
          with-ratchet: 'true'

      # Whether the token is set, as a plain output. The expression is
      # evaluated before the shell runs, so this step binds nothing: the
      # token is in no step's env, because the upload action is composite
      # and passes its step env to nested upload-artifact and cache steps.
      - name: Check CodeScene token
        id: codescene-token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage data to CodeScene
        # The ref as well as the token: a dispatch can aim at any branch,
        # and the upload carries no ref of its own.
        if: >-
          steps.codescene-token.outputs.available == 'true'
          && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@759da19f0379b6d2d7ddef93b7ad4c3b98154e41
        with:
          path: coverage.xml
          format: cobertura
          mode: upload
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
          # No checksum input: the action pins the CLI through its own
          # manifest, and `installer-checksum` is rejected from this pin.
