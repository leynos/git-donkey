# Treat malformed manuals as build failures, not warnings in shipped pages.
[general]
halt-level = warning
report-level = warning
exit-status-level = warning
input-encoding = utf-8
output-encoding = utf-8
generator = no
datestamp =
source-link = no

# Manuals are self-contained and must not incorporate build-host files.
[parsers]
file-insertion-enabled = no
raw-enabled = no
